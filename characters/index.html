<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elf Viewer</title>
    <style>
      :root { color-scheme: dark; --panel: rgba(14, 17, 24, 0.86); --line: #2a3140; --text: #e6e9f0; --dim: #93a0b4; --accent: #5ee0a8; --p2: #ff6b7d; }
      html, body { margin: 0; height: 100%; background: #0b0e14; color: var(--text); font: 13px/1.4 system-ui, -apple-system, sans-serif; overflow: hidden; }
      canvas { display: block; }
      #panel { position: absolute; top: 12px; left: 12px; width: 268px; max-height: calc(100% - 24px); overflow: auto; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(6px); }
      #panel h1 { font-size: 14px; margin: 0 0 4px; letter-spacing: .02em; }
      #panel h2 { font-size: 11px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .07em; margin: 12px 0 6px; }
      #panel h2.p1 { color: var(--accent); } #panel h2.p2 { color: var(--p2); }
      .row { display: flex; flex-wrap: wrap; gap: 5px; }
      button { background: #1d2330; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button.on { background: var(--accent); color: #06140e; border-color: var(--accent); }
      label { display: flex; align-items: center; gap: 8px; color: var(--dim); margin: 4px 0; }
      input[type=range] { flex: 1; accent-color: var(--accent); }
      #stats { position: absolute; top: 12px; right: 12px; min-width: 170px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; font-variant-numeric: tabular-nums; white-space: pre; font-size: 12px; }
      #boot { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 15px; }
      .hint { color: var(--dim); font-size: 11.5px; margin-top: 8px; }
      @media (max-width: 600px) { #panel { width: calc(100% - 56px); max-height: 46%; } #stats { top: auto; bottom: 12px; } }
    </style>
  </head>
  <body>
    <div id="boot">Loading elf…</div>
    <div id="panel" hidden>
      <h1>Elf on G1</h1>
      <div class="hint" style="margin-top:0">Procedural G1 joint curves → FK → CharacterView.</div>
      <h2 class="p1">Player 1 (green)</h2>
      <div class="row" id="m1"></div>
      <h2 class="p2">Player 2 (crimson)</h2>
      <div class="row" id="m2"></div>
      <h2>Both</h2>
      <div class="row" id="mb"></div>
      <div class="row" style="margin-top:6px">
        <button id="exchange">Auto exchange</button>
        <button id="flash">Hit flash</button>
      </div>
      <h2>Look</h2>
      <label>Glow <input id="glow" type="range" min="0" max="1" step="0.01" value="0" /></label>
      <label>Speed <input id="speed" type="range" min="0.05" max="1.5" step="0.05" value="1" /></label>
      <label><input id="skel" type="checkbox" /> G1 skeleton overlay</label>
      <label><input id="skin" type="checkbox" checked /> Show skin</label>
      <label><input id="bloom" type="checkbox" checked /> Bloom</label>
      <div class="hint">Drag to orbit, scroll to zoom. Bind pose = BodyNow equals BodyBind, so the mesh must match the asset exactly.</div>
    </div>
    <div id="stats" hidden></div>
    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
