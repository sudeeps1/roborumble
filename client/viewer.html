<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%232b1d0e%22/%3E%3Cpath d=%22M16 5l3 8h8l-6.5 5 2.5 8-7-5-7 5 2.5-8L5 13h8z%22 fill=%22%23f2c14e%22/%3E%3C/svg%3E" />
    <title>Motion Viewer</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; background: #0b1020; color: #f3e6c4; font: 14px/1.4 ui-monospace, Menlo, monospace; }
      #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #info { position: fixed; left: 16px; top: 12px; right: 300px; white-space: pre-wrap; text-shadow: 0 1px 3px #000; pointer-events: none; }
      #side { position: fixed; right: 0; top: 0; bottom: 0; width: 280px; overflow-y: auto; background: rgba(8, 10, 20, 0.72); padding: 12px; }
      #side h2 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.7; margin-bottom: 8px; }
      #side p { opacity: 0.6; font-size: 12px; margin-bottom: 10px; }
      #list { list-style: none; }
      #list li { padding: 4px 6px; border-radius: 4px; cursor: pointer; }
      #list li:hover { background: rgba(255, 255, 255, 0.08); }
      #list li.on { background: rgba(255, 210, 120, 0.25); }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <pre id="info">Loading…</pre>
    <div id="side">
      <h2>Motions</h2>
      <p>←/→ switch · space pause · , . step · 1 2 3 speed<br />Drop an agent batch JSON here.</p>
      <ul id="list"></ul>
    </div>
    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
