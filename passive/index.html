<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passive rig</title>
    <style>
      :root { color-scheme: dark; --panel: rgba(18, 20, 26, 0.88); --line: #2c313c; --text: #e6e8ee; --dim: #9aa2b1; --accent: #f0a63c; }
      html, body { margin: 0; height: 100%; background: #101217; color: var(--text); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
      canvas { display: block; }
      #panel { position: absolute; top: 12px; left: 12px; width: 250px; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
      #panel h1 { font-size: 14px; margin: 0 0 8px; }
      #panel h2 { font-size: 11px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; margin: 12px 0 6px; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; }
      button { background: #232834; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button.on { background: var(--accent); color: #1a1205; border-color: var(--accent); }
      label { display: flex; align-items: center; gap: 8px; color: var(--dim); }
      input[type=range] { flex: 1; }
      #status { position: absolute; top: 12px; right: 12px; min-width: 210px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; font-variant-numeric: tabular-nums; white-space: pre; }
      #boot { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 15px; }
      .hint { color: var(--dim); font-size: 12px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="boot">Loading MuJoCo and SONIC…</div>
    <div id="panel" hidden></div>
    <div id="status" hidden></div>
    <script type="module" src="/src/rig/main.ts"></script>
  </body>
</html>
